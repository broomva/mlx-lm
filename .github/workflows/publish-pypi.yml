# Publish mlx-lm-broomva to PyPI via Trusted Publishing (OIDC) — NO token/secret.
#
# One-time PyPI setup (only you can do this — it's your account):
#   1. https://pypi.org/manage/account/publishing/  → "Add a pending publisher"
#   2. PyPI Project Name: mlx-lm-broomva
#      Owner:            broomva
#      Repository name:  mlx-lm
#      Workflow name:    publish-pypi.yml
#      Environment name: pypi
#   3. Save. (No token is generated or stored anywhere.)
#
# Then publish by either:
#   - pushing a tag matching `pypi-v*`  (e.g. `git tag pypi-v0.31.3 && git push origin pypi-v0.31.3`), or
#   - Actions tab → "publish-pypi" → Run workflow.
#
# GitHub mints a short-lived OIDC token at run time; PyPI verifies it against the
# pending-publisher config above. No long-lived credential ever exists.
name: publish-pypi

on:
  workflow_dispatch: {}
  push:
    tags:
      - "pypi-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify the package metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Publish to PyPI (Trusted Publishing — no token)
        uses: pypa/gh-action-pypi-publish@release/v1
